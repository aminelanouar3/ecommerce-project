<div class="products-container">
  <div class="product-card" *ngFor="let product of products">
    <h3>{{ product.name }}</h3>
    <p class="desc">{{ product.description }}</p>
    <p class="price">{{ product.price }} TND</p>
    <button (click)="addToCart(product)">Add to Cart</button>
  </div>
</div>
