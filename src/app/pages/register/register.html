<div class="auth-container">

  <div class="auth-card">

    <h2>Create Account</h2>

    <form (ngSubmit)="onSubmit()">

      <input
        type="text"
        placeholder="Full Name"
        [(ngModel)]="user.name"
        name="name"
        required
      />

      <input
        type="email"
        placeholder="Email"
        [(ngModel)]="user.email"
        name="email"
        required
      />

      <input
        type="password"
        placeholder="Password"
        [(ngModel)]="user.password"
        name="password"
        required
      />

      <button type="submit">Register</button>

    </form>

    <p class="error" *ngIf="message">
      {{ message }}
    </p>

    <p class="link">
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>

  </div>

</div>
